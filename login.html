<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMagic - Acceso y Registro</title>
    <link rel="icon" type="image/png" href="imagenes/Cnlogo.png">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">

    <header class="main-header">
        <div class="logo-area" style="display: flex; align-items: center; gap: 10px;">
            <img src="imagenes/Cnlogo.png" class="logo-circular" alt="Logo CineMagic" style="width: 40px; height: 40px; border-radius: 50%;">
            <h1><a href="index.html" style="color: inherit; text-decoration: none;">Cine<span>Magic</span></a></h1>
        </div>
        <a href="index.html" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Volver al Inicio
        </a>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active">
                    <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesion
                </button>
                <button id="tab-register" class="tab-btn">
                    <i class="fa-solid fa-user-plus"></i> Registrarse
                </button>
            </div>

            <form id="form-login" class="auth-form active-form">
                <div class="form-header">
                    <h2>Hola de nuevo!</h2>
                    <p>Ingresa tus datos para acceder a tu cuenta y sacar tus entradas.</p>
                </div>

                <div class="input-group">
                    <label for="login-email"><i class="fa-solid fa-envelope icon-accent"></i> Correo Electronico</label>
                    <input type="email" id="login-email" placeholder="ejemplo@cinemagic.com" required>
                </div>

                <div class="input-group">
                    <label for="login-password"><i class="fa-solid fa-lock icon-accent"></i> Contrasena</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox"> Recordarme
                    </label>
                    <a href="#" class="forgot-link">Olvidaste tu contrasena?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar a CineMagic
                </button>
            </form>

            <form id="form-register" class="auth-form">
                <div class="form-header">
                    <h2>Crear una Cuenta</h2>
                    <p>Sumate a CineMagic para acceder a promociones exclusivas.</p>
                </div>

                <div class="input-group">
                    <label for="reg-name"><i class="fa-solid fa-user icon-accent"></i> Nombre Completo</label>
                    <input type="text" id="reg-name" placeholder="Juan Perez" required>
                </div>

                <div class="input-group">
                    <label for="reg-email"><i class="fa-solid fa-envelope icon-accent"></i> Correo Electronico</label>
                    <input type="email" id="reg-email" placeholder="ejemplo@cinemagic.com" required>
                </div>

                <div class="input-group">
                    <label for="reg-password"><i class="fa-solid fa-lock icon-accent"></i> Contrasena</label>
                    <input type="password" id="reg-password" placeholder="Minimo 6 caracteres" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fa-solid fa-user-check"></i> Crear Mi Cuenta
                </button>
            </form>

        </div>
    </main>

    <footer class="main-footer">
        <p>© 2026 CineMagic. Disfruta con las personas que mas queres con la mejor comodidad.</p>
    </footer>

    <script src="login.js"></script>
</body>
</html>
